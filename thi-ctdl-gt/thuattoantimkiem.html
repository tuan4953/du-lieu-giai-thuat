<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thuật Toán Tìm Kiếm Tuyến Tính</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .khung {
            border: 1px solid #333;
            padding: 20px;
            max-width: 600px;
        }
        input, button {
            padding: 6px 12px;
            font-size: 15px;
        }
        #ketQua {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="khung">
        <h2>Thuật Toán Tìm Kiếm Tuyến Tính (Linear Search)</h2>
        <p><strong>Mảng dữ liệu:</strong> <span id="hienThiMang"></span></p>

        <label for="soCanTim">Nhập số cần tìm: </label>
        <input type="number" id="soCanTim" value="23" placeholder="Nhập số...">
        <button onclick="xuLyTimKiem()">Tìm kiếm</button>

        <div id="ketQua"></div>
    </div>

    <script>
        /*
        ========================================================================
        CÁC BƯỚC THỰC HIỆN THUẬT TOÁN TÌM KIẾM TUYẾN TÍNH (LINEAR SEARCH):

        Bước 1: Bắt đầu từ phần tử đầu tiên của mảng, gán chỉ số duyệt i = 0.
        Bước 2: So sánh giá trị của phần tử hiện tại arr[i] với giá trị cần tìm (x).
        Bước 3: Nếu arr[i] == x:
                -> Tìm thấy giá trị x tại vị trí index i.
                -> Dừng thuật toán và trả về vị trí i.
        Bước 4: Nếu arr[i] != x:
                -> Tăng chỉ số i lên 1 đơn vị (i = i + 1) để chuyển sang phần tử tiếp theo.
        Bước 5: Lặp lại Bước 2 và Bước 4 cho đến khi duyệt hết mảng (i >= độ dài mảng n).
        Bước 6: Nếu duyệt hết toàn bộ mảng mà vẫn không tìm thấy:
                -> Kết luận giá trị x không tồn tại trong mảng.
                -> Trả về -1.
        ========================================================================
        */

        const arr = [4, 7, 10, 15, 23, 38, 42, 20, 40, 99, 80];

        document.getElementById("hienThiMang").innerText = "[" + arr.join(", ") + "]";

        function timKiemTuyenTinh(a, x) {
          
            for (let i = 0; i < a.length; i++) {
                
                if (a[i] === x) {
                   
                    return i;
                }        
            }
            return -1;
        }
        function xuLyTimKiem() {
            const giaTriNhap = document.getElementById("soCanTim").value;
            const ketQuaEl = document.getElementById("ketQua");

            if (giaTriNhap === "") {
                ketQuaEl.innerText = "Vui lòng nhập một số để tìm kiếm!";
                ketQuaEl.style.color = "red";
                return;
            }

            const x = parseInt(giaTriNhap);

            const viTri = timKiemTuyenTinh(arr, x);

            if (viTri !== -1) {
                ketQuaEl.innerText = "=> Tìm thấy số " + x + " tại vị trí index: " + viTri;
                ketQuaEl.style.color = "green";
            } else {
                ketQuaEl.innerText = "=> Không tìm thấy số " + x + " trong mảng (trả về -1)";
                ketQuaEl.style.color = "red";
            }
        }
    </script>
</body>
</html>
